<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Registro de Gimnasio</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f6f4;--card:#ffffff;--ink:#17171a;--mute:#8a8a90;--line:#ebebe8;--field:#f8f8f6;--acc:#2f6bff;--acc-soft:#e9efff;--bad:#e5484d;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:16px 18px 8px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
main{padding:4px 16px}
h2{font-size:17px;font-weight:650;margin:0}
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.03)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini{font-size:13px;color:var(--mute);margin:0}
.sect{margin:20px 4px 8px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.campo{display:grid;gap:6px;font-size:13px;color:var(--mute);margin-top:12px}
.fecha-card{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fecha-card strong{font-size:17px;font-weight:600}
.fecha-card input{width:auto;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{padding:8px 13px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips.muted .chip{color:var(--mute);border-style:dashed;background:none}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;color:var(--mute);font-weight:500;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.serie-head,.serie-row{display:grid;grid-template-columns:26px 1fr 1fr 36px;gap:8px;align-items:center}
.serie-head{font-size:12px;color:var(--mute);margin:8px 0 4px;padding:0 2px;text-align:center}
.serie-row{margin-bottom:8px}
.serie-row .num{font-size:14px;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.serie-row input{text-align:center;font-variant-numeric:tabular-nums;padding:10px 6px}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mute);background:var(--field);border:1px solid var(--line);flex:none}
.ico.peligro{background:var(--bad);color:#fff;border-color:var(--bad);font-size:13px;font-weight:600;width:auto;padding:0 10px}
.ico:disabled{opacity:.35}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;text-align:center;margin-top:8px}
.btn.ghost{background:var(--acc-soft);color:var(--acc)}
.btn.salir{background:#fdecec;color:var(--bad)}
.estimo{font-size:13px;color:var(--mute);margin:12px 2px 0;font-variant-numeric:tabular-nums}
.link{color:var(--acc);font-weight:600;font-size:14px}
.ej{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:8px;border-radius:16px}
.ej.activo{box-shadow:0 0 0 2px var(--acc)}
.ej-main{flex:1;text-align:left;min-width:0}
.ej-main strong{display:block;font-size:16px;font-weight:600}
.ej-main .mini{display:block;margin-top:3px;overflow-wrap:anywhere}
.ej-side{display:flex;align-items:center;gap:8px;flex:none}
.ej-side .mini{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{text-align:center;color:var(--mute);font-size:14px;margin:18px 0}
.vacio{text-align:center;color:var(--mute);padding:36px 12px}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;padding:24px 8px}
.login h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.login p{color:var(--mute);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
.stats b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.fila-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.fila-item:first-of-type{border-top:0}
.delta{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
.delta.up{color:#1f9d55}
.delta.down{color:var(--bad)}
.grafico svg{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:9;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.guia{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mapa-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mapa-head .seg{margin:0;width:170px;flex:none}
.figura svg{display:block;width:min(260px,72vw);height:auto;margin:8px auto 0;border-radius:12px}
.zona{cursor:pointer}
.zona polygon{fill:#ff7a2e;fill-opacity:.55;stroke:#ff5a10;stroke-width:1.5;mix-blend-mode:multiply}
.zona.on polygon{fill:#ff5a10;fill-opacity:.8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:inherit;cursor:pointer}
.chip.on{background:#ff6a1f;border-color:#ff6a1f;color:#fff}
.zona-no *{fill:#e4e7eb;stroke:#9aa0a9;stroke-width:.8}
.aclar{font-size:13px;color:var(--mute);text-align:center;margin:8px 0 0}
.centro{text-align:center;margin-top:4px}
.ejx{padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.ejx strong{font-size:15px;font-weight:600}
.ejx .mini{margin-top:3px}
.ejx .ok{color:#1f9d55;font-weight:600}
.ejx .row{display:flex;gap:8px;margin-top:10px}
.btn.sm{padding:9px 10px;font-size:14px;margin-top:0;flex:1}
.pasos{margin:8px 0 0;padding-left:20px;font-size:14px}
.pasos li{margin:4px 0}
</style>
</head>

    modo: ui.f.modo, intensidad: ui.f.intens, pesoCorporal: S.perfil.peso,
    series: ui.f.series.map(s => ({ v: num(s.v), kg: num(s.kg) }))
  });
  return `≈ ${Math.round(r.kcal)} kcal · ${Math.round(r.min)} min (estimado)`;
}
function tarjetaEj(e) {
  const r = calcEj(e);
  const confirmando = ui.confirm === "e:" + e.id;
  return `<article class="card ej ${ui.edit === e.id ? "activo" : ""}">
    <button class="ej-main" data-act="editar" data-id="${e.id}">
      <strong>${esc(e.nombre)}</strong>
      <span class="mini">${esc(e.grupo)} · ${esc(resumen(e))}</span>
    </button>
    <div class="ej-side">
      <span class="mini">${Math.round(r.kcal)} kcal</span>
      <button class="ico ${confirmando ? "peligro" : ""}" data-act="borrar" data-id="${e.id}" aria-label="Borrar ejercicio">${confirmando ? "Sí, borrar" : ICON.trash}</button>
    </div>
  </article>`;
}
function vLogin() {
  return `<section class="login">
    <h2>Registro de gimnasio</h2>
    <p>Entrá con tu cuenta de Google para guardar tus entrenamientos en la nube y verlos desde cualquier celular.</p>
    <button class="btn" data-act="entrar">Entrar con Google</button>
  </section>`;
}
function vHoy() {
  const delDia = entradasDe(ui.fecha);
  const total = delDia.reduce((a, e) => a + calcEj(e).kcal, 0);
  const f = ui.f, editando = !!ui.edit;
  const lista = GRUPOS.filter(g => delDia.some(e => e.grupo === g)).map(g =>
    `<p class="sect">${esc(g)}</p>${delDia.filter(e => e.grupo === g).map(tarjetaEj).join("")}`).join("");
  return `
  <section class="card fecha-card">
    <div><p class="mini">Fecha del entrenamiento</p><strong>${esc(dia(ui.fecha))}</strong></div>
    <input type="date" id="fecha" value="${ui.fecha}" aria-label="Elegir fecha">
  </section>

  <section class="card">
    <div class="card-head">
      <h2>${editando ? "Editar ejercicio" : "Nuevo ejercicio"}</h2>
      ${editando ? '<button class="link" data-act="cancelar">Cancelar</button>' : ""}
    </div>
    <p class="mini">Grupo muscular</p>
    <div class="chips">${GRUPOS.map(g => `<button class="chip ${f.grupo === g ? "on" : ""}" data-act="grupo" data-v="${g}">${g}</button>`).join("")}</div>
    ${f.grupo ? vGuia(f.grupo) : ""}
    <label class="campo">Ejercicio
      <input id="nombre" list="ejs" placeholder="Ej: Curl de bíceps" value="${esc(f.nombre)}" autocomplete="off" maxlength="60">
    </label>
    <datalist id="ejs">${nombresConocidos().map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <p class="mini" style="margin-top:12px">Tipo</p>
    ${seg("set", "modo", [["reps", "Repeticiones"], ["tiempo", "Tiempo"]], f.modo)}
    <p class="mini">Intensidad</p>
    ${seg("set", "intens", Object.keys(INTENS).map(k => [k, k]), f.intens)}

    <div class="serie-head"><span></span><span>${f.modo === "tiempo" ? "Segundos" : "Repeticiones"}</span><span>Peso (kg)</span><span></span></div>
    ${f.series.map((s, i) => `<div class="serie-row">
        <span class="num">${i + 1}</span>
        <input inputmode="numeric" data-s="${i}" data-k="v" value="${esc(s.v)}" aria-label="Serie ${i + 1}, ${f.modo === "tiempo" ? "segundos" : "repeticiones"}">
        <input inputmode="decimal" data-s="${i}" data-k="kg" value="${esc(s.kg)}" aria-label="Serie ${i + 1}, peso en kilos">
        <button class="ico" data-act="quitarSerie" data-i="${i}" aria-label="Quitar serie" ${f.series.length <= 1 ? "disabled" : ""}>−</button>
      </div>`).join("")}
    <button class="btn ghost" data-act="agregarSerie">+ Agregar serie</button>
    <p class="estimo" id="estimo">${estimo()}</p>
    <button class="btn" data-act="guardarEj">${editando ? "Guardar cambios" : "Guardar ejercicio"}</button>
  </section>

  ${lista ? `<p class="sect" style="margin-top:22px">Guardados el ${esc(corto(ui.fecha))}</p>${lista}
    <p class="total">Total estimado: <strong>${Math.round(total)} kcal</strong></p>`
    : `<p class="vacio">Todavía no guardaste ejercicios para este día.</p>`}`;
}
function vHistorial() {
  if (!S.entries.length) return `<p class="vacio">Acá va a aparecer todo lo que guardes, ordenado por fecha.</p>`;
  const fechas = [...new Set(S.entries.map(e => e.fecha))].sort().reverse();
  return fechas.map(f => {
    const list = entradasDe(f);
    const kcal = list.reduce((a, e) => a + calcEj(e).kcal, 0);
    return `<p class="sect">${esc(dia(f))} · ${Math.round(kcal)} kcal</p>${list.map(tarjetaEj).join("")}`;
  }).join("");
}
function grafico(ini, n, vals) {
  const W = 340, H = 160, padX = 6, base = 136, top = 16;
  const max = Math.max(1, ...Object.values(vals));
  const bw = (W - padX * 2) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calorías estimadas por día">`;
  for (let i = 0; i < n; i++) {
    const f = sumarDias(ini, i), v = vals[f] || 0;
    const h = (base - top) * v / max, x = padX + i * bw + bw * 0.2, w = bw * 0.6;
    s += `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="4" fill="${v ? "#2f6bff" : "#ebebe8"}"/>`;
    if (n === 7 || i % 5 === 0 || i === n - 1) {
      const lbl = n === 7 ? parseF(f).toLocaleDateString("es-AR", { weekday: "narrow" }) : String(parseF(f).getDate());
      s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#8a8a90">${lbl}</text>`;
    }
  }
  return s + `</svg>`;
}
function vReportes() {
  const dias = ui.rango === "semana" ? 7 : 30;
  const fin = hoy(), ini = sumarDias(fin, -(dias - 1));
  const ents = S.entries.filter(e => e.fecha >= ini && e.fecha <= fin).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const rangoBtns = seg("rango", "rango", [["semana", "7 días"], ["mes", "30 días"]], ui.rango === "semana" ? "semana" : "mes");
  if (!ents.length) return rangoBtns + `<p class="vacio">No hay ejercicios guardados en este período.</p>`;

  const kcalDia = {};
  ents.forEach(e => kcalDia[e.fecha] = (kcalDia[e.fecha] || 0) + calcEj(e).kcal);
  const total = Object.values(kcalDia).reduce((a, b) => a + b, 0);
  const series = ents.reduce((a, e) => a + e.series.length, 0);
  const max = Math.max(...Object.values(kcalDia));

  const gruposHtml = GRUPOS.map(g => [g, new Set(ents.filter(e => e.grupo === g).map(e => e.fecha)).size])
    .map(([g, n]) => `<span class="chip">${g} · ${n}</span>`).join("");
  const sinTrabajar = GRUPOS.filter(g => !ents.some(e => e.grupo === g));

  const porNombre = {};
  ents.forEach(e => { const k = e.nombre.trim().toLowerCase(); (porNombre[k] ||= { nombre: e.nombre.trim(), reg: [] }).reg.push(e); });
  const filas = Object.values(porNombre).sort((a, b) => a.nombre.localeCompare(b.nombre, "es")).map(x => {
    const a = x.reg[0], b = x.reg[x.reg.length - 1];
    const d = Math.round((maxKg(b) - maxKg(a)) * 10) / 10;
    const cls = d > 0 ? "up" : d < 0 ? "down" : "";
    return `<div class="fila-item"><div><strong>${esc(x.nombre)}</strong>
      <p class="mini">${x.reg.length} ${x.reg.length === 1 ? "vez" : "veces"} · última ${esc(corto(b.fecha))}: ${maxKg(b)} kg máx.</p></div>
      <span class="delta ${cls}">${x.reg.length > 1 ? (d > 0 ? "+" : "") + d + " kg" : "—"}</span></div>`;
  }).join("");

  const conPeso = ents.filter(e => e.pesoCorporal);
  const pesoHtml = conPeso.length ? (() => {
    const a = conPeso[0].pesoCorporal, b = conPeso[conPeso.length - 1].pesoCorporal, d = Math.round((b - a) * 10) / 10;
    return `<section class="card"><p class="mini">Peso corporal</p>
      <p style="margin:6px 0 0"><strong style="font-size:22px;font-variant-numeric:tabular-nums">${a} → ${b} kg</strong>
      <span class="delta ${d > 0 ? "down" : d < 0 ? "up" : ""}"> ${d > 0 ? "+" : ""}${d} kg</span></p></section>`;
  })() : "";

  return `${rangoBtns}
    <section class="card stats">
      <div><b>${Object.keys(kcalDia).length}</b><span>días</span></div>
      <div><b>${ents.length}</b><span>ejercicios</span></div>
      <div><b>${series}</b><span>series</span></div>
      <div><b>${Math.round(total)}</b><span>kcal</span></div>
    </section>
    <section class="card">
      <p class="mini">Kcal estimadas por día · máximo ${Math.round(max)}</p>
      <div class="grafico" style="margin-top:8px">${grafico(ini, dias, kcalDia)}</div>
    </section>
    <section class="card">
      <p class="mini" style="margin-bottom:8px">Grupos trabajados (días)</p>
      <div class="chips">${gruposHtml}</div>
      ${sinTrabajar.length ? `<p class="mini" style="margin-top:10px">Sin trabajar en este período: ${sinTrabajar.join(", ")}.</p>` : ""}
    </section>
    <section class="card">
      <p class="mini" style="margin-bottom:4px">Progresión por ejercicio</p>
      ${filas}
    </section>
    ${pesoHtml}`;
}
function vPerfil() {
  const mail = auth.currentUser?.email || "";
  return `<section class="card">
      <p class="mini">Sesión iniciada como</p>
      <p style="margin:4px 0 0;font-weight:600;overflow-wrap:anywhere">${esc(mail)}</p>
      <button class="btn salir" data-act="salir">Cerrar sesión</button>
    </section>
    <section class="card">
      <label class="campo">Peso corporal (kg)<input data-perfil="peso" inputmode="decimal" value="${S.perfil.peso}"></label>
      <label class="campo">Altura (cm)<input data-perfil="altura" inputmode="numeric" value="${S.perfil.altura}"></label>
      <label class="campo">Edad<input data-perfil="edad" inputmode="numeric" value="${S.perfil.edad}"></label>
      <p class="mini" style="margin-top:12px">El peso se usa para calcular las calorías de los ejercicios que guardes desde ahora. Los anteriores conservan el peso de ese momento.</p>
    </section>
    <section class="card">
      <h2 style="margin-bottom:6px">Copia de seguridad</h2>
      <p class="mini">Guarda un archivo con todos tus ejercicios, por si necesitás tenerlo a mano.</p>
      <button class="btn ghost" data-act="exportar">Exportar copia</button>
      <button class="btn ghost" data-act="importarBtn">Importar copia</button>
      <input type="file" id="importar" accept="application/json,.json" hidden>
    </section>`;
}

/* ---------- acciones ---------- */
function toast(m) {
  const t = $("#toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(ui.toastT); ui.toastT = setTimeout(() => t.classList.remove("on"), 2200);
}
function editar(id) {
  const e = S.entries.find(x => x.id === id);
  if (!e) return;
  ui.edit = id; ui.fecha = e.fecha; ui.tab = "hoy"; ui.confirm = null; ui.zona = null; ui.pasosKey = null;
  ui.f = { grupo: e.grupo, nombre: e.nombre, modo: e.modo, intens: e.intensidad, series: e.series.map(s => ({ v: String(s.v), kg: String(s.kg) })) };
  render(); window.scrollTo(0, 0);
}
function guardarEj() {
  const f = ui.f, nombre = f.nombre.trim();
  if (!f.grupo) return toast("Elegí un grupo muscular");
  if (!nombre) return toast("Ponele un nombre al ejercicio");
  const series = f.series.map(s => ({ v: num(s.v), kg: num(s.kg) }));
  if (series.some(s => s.v <= 0)) return toast("Cada serie necesita reps o segundos");
  const prev = ui.edit ? S.entries.find(x => x.id === ui.edit) : null;
  const e = {
    id: ui.edit || uid(), fecha: ui.fecha, grupo: f.grupo, nombre, modo: f.modo, intensidad: f.intens,
    pesoCorporal: prev ? prev.pesoCorporal : S.perfil.peso, series
  };
  setDoc(refEj(e.id), sinId(e)).catch(fallo);
  ui.edit = null; ui.confirm = null;
  ui.f = freshForm({ grupo: f.grupo });
  render();
  toast(prev ? "Cambios guardados" : "Ejercicio guardado");
}
function usarEj(n) {
  const par = Object.entries(ZONAS).find(([k, z]) => z.ej.some(e => e.n === n));
  if (!par) return;
  const [zk, z] = par;
  const e = z.ej.find(x => x.n === n);
  ui.f.grupo = z.g; ui.f.nombre = e.n; ui.f.modo = e.m || "reps";
  ui.zona = zk; ui.vista = z.v; ui.eq = "Todos"; ui.pasosKey = null;
  render();
  requestAnimationFrame(() => { const el = document.getElementById("nombre"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); });
  toast("Listo: completá peso y series");
}
function autocompletar(nombre) {
  if (ui.edit) return;
  const n = nombre.trim().toLowerCase();
  if (!n) return;
  const ult = [...S.entries].reverse().find(e => e.nombre.trim().toLowerCase() === n);
  if (!ult) return;
  ui.f.grupo = ui.f.grupo || ult.grupo;
  ui.f.modo = ult.modo; ui.f.intens = ult.intensidad;
  ui.f.series = ult.series.map(s => ({ v: String(s.v), kg: String(s.kg) }));
  render();
}
function exportar() {
  const blob = new Blob([JSON.stringify({ version: 2, perfil: S.perfil, entries: S.entries }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `gimnasio-${hoy()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast("Copia lista");
}
async function importar(file) {
  if (!file) return;
  try {
    const o = JSON.parse(await file.text());
    if (!Array.isArray(o.entries)) throw new Error("formato");
    const ids = new Set(S.entries.map(e => e.id));
    const nuevos = o.entries.filter(e => e && e.id && !ids.has(e.id));
    nuevos.forEach(e => setDoc(refEj(e.id), sinId(e)).catch(fallo));
    toast(`Importados ${nuevos.length} ejercicios`);
  } catch (e) { toast("Ese archivo no es una copia válida"); }
}

function render() {
  if (!authListo) { app.innerHTML = `<p class="vacio">Cargando…</p>`; tabsEl.innerHTML = ""; return; }
  if (!UID) { app.innerHTML = vLogin(); tabsEl.innerHTML = ""; return; }
  if (!LISTO) { app.innerHTML = `<p class="vacio">Cargando tus entrenamientos…</p>`; tabsEl.innerHTML = ""; return; }
  tabsEl.innerHTML = [["hoy", "Entrenar", ICON.plus], ["historial", "Historial", ICON.list], ["reportes", "Reportes", ICON.bars], ["perfil", "Perfil", ICON.user]]
    .map(([k, l, i]) => `<button data-tab="${k}" ${ui.tab === k ? 'aria-current="page"' : ""}>${i}<span>${l}</span></button>`).join("");
  const vistas = { hoy: vHoy, historial: vHistorial, reportes: vReportes, perfil: vPerfil };
  app.innerHTML = `<header class="top"><h1>${TITULOS[ui.tab]}</h1></header><main>${vistas[ui.tab]()}</main>`;
}

/* ---------- eventos ---------- */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case "entrar": entrar(); return;
    case "salir": signOut(auth); return;
    case "grupo": ui.f.grupo = b.dataset.v; ui.zona = null; ui.pasosKey = null; ui.vista = vistaDefault(b.dataset.v); break;
    case "vista": ui.vista = b.dataset.v; ui.zona = null; ui.eq = "Todos"; break;
    case "eq": ui.eq = b.dataset.v; break;
    case "zona": { const z = b.dataset.z; ui.zona = ui.zona === z ? null : z; ui.eq = "Todos"; ui.pasosKey = null; break; }
    case "verTodos": ui.zona = null; ui.eq = "Todos"; break;
    case "pasos": { const n = b.dataset.n; ui.pasosKey = ui.pasosKey === n ? null : n; break; }
    case "usarEj": usarEj(b.dataset.n); return;
    case "set": if (b.dataset.k === "modo") ui.f.modo = b.dataset.v; else ui.f.intens = b.dataset.v; break;
    case "agregarSerie": { const last = ui.f.series[ui.f.series.length - 1]; ui.f.series.push({ v: last.v, kg: last.kg }); break; }
    case "quitarSerie": if (ui.f.series.length > 1) ui.f.series.splice(Number(b.dataset.i), 1); break;
    case "guardarEj": return guardarEj();
    case "cancelar": ui.edit = null; ui.f = freshForm({ grupo: ui.f.grupo }); break;
    case "editar": return editar(b.dataset.id);
    case "borrar": {
      const id = b.dataset.id;
      if (ui.confirm !== "e:" + id) { ui.confirm = "e:" + id; break; }
      deleteDoc(refEj(id)).catch(fallo);
      if (ui.edit === id) { ui.edit = null; ui.f = freshForm(); }
      ui.confirm = null; toast("Ejercicio borrado");
      break;
    }
    case "rango": ui.rango = b.dataset.v; break;
    case "exportar": exportar(); return;
    case "importarBtn": $("#importar").click(); return;
  }
  render();
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nombre") { ui.f.nombre = t.value; return; }
  if (t.dataset.s !== undefined) {
    ui.f.series[Number(t.dataset.s)][t.dataset.k] = t.value;
    const el = $("#estimo"); if (el) el.textContent = estimo();
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fecha") { ui.fecha = t.value || hoy(); ui.confirm = null; render(); }
  if (t.id === "nombre") autocompletar(t.value);
  if (t.id === "importar") { importar(t.files[0]); t.value = ""; }
  if (t.dataset.perfil) {
    const k = t.dataset.perfil;
    S.perfil[k] = num(t.value);
    setDoc(refUser(), { perfil: S.perfil }, { merge: true }).catch(fallo);
  }
});
tabsEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  ui.tab = b.dataset.tab; ui.confirm = null;
  render(); window.scrollTo(0, 0);
});

render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
